# ======================================================================
# AE crack detection: configuration used for every result in this thesis
#
#  * background: 1,600,000 samples (0.8 s) of channel 1, enough room for
#    2 x 75 events x 4096 samples = 614,400 non-overlapping samples;
#  * events are drawn without replacement (dataset.replace: false);
#  * crack and noise events are the expert-labelled test events,
#    listed by file name (see Event Libraries below).
# ======================================================================

# Signal & STFT Parameters
signal:
  dt: 5.0e-7          # sampling time step (s)
  fs: 2000000         # sampling frequency (Hz)
  channel: 1          # channel index (1=structure-borne, 2=airborne)

stft:
  n_fft: 264
  hop_length: 64
  win_length: 250
  power: 2

# Class Labels
classes:
  background: 0
  crack: 1
  noise: 2

# Dataset
dataset:
  chunk_size: 256     # spectrogram frames per training sample
  # test_size: 0.2  -- not used: evaluation is 5-fold cross-validation
  seed: 42
  n_samples: 1600000  # background length: room for all 150 events
  n_per_class: 75    # events injected per class, of 100 labelled
  replace: false     # each labelled event injected at most once

# Event Libraries
# The two event directories are two experimental series (2022: Al92Mn6Ce2,
# 2 V threshold; 2024: AA2024, 1.3 V threshold), not two classes: both
# contain crack and noise events, and individual events carry no labels.
# The labelled events are D. Kononenko's 100 crack and 100 noise test
# events (selected manually on expert knowledge; Figs. 8 and 9 of
# kononenko2024embedded), listed here by file name. n_per_class of them
# are drawn per class, without replacement.
