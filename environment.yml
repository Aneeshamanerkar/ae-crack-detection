name: ae-crack-detection

channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  - python=3.11

  - pytorch::pytorch=2.5.1
  - pytorch::torchaudio=2.5.1

  - conda-forge::numpy>=1.26
  - conda-forge::scipy>=1.12
  - conda-forge::pandas>=2.0

  - conda-forge::matplotlib>=3.9
  - conda-forge::seaborn>=0.13

  - conda-forge::pyyaml>=6.0
  - conda-forge::tqdm>=4.66

  - conda-forge::jupyterlab>=4.0
  - conda-forge::ipykernel>=6.0

  - pip
  - pip:
      - scikit-learn==1.9.0
      - loguru>=0.7
      - jupyter
      - ipywidgets
